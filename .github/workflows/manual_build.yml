name: Manual Build Turnip Drivers

on:
  workflow_dispatch:

jobs:
  find-turnip-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_matrix.outputs.tag_name }}
      matrix: ${{ steps.get_matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Discover Turnip Assets
        id: get_matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/package_turnip.py --mode get-matrix

  build-driver:
    needs: find-turnip-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ fromJson(needs.find-turnip-release.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant execute permission for gradlew and scripts
        run: |
          chmod +x gradlew
          chmod +x scripts/package_turnip.py

      - name: Build Driver APK (${{ matrix.driver.name }})
        id: build_apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/package_turnip.py --mode build-single \
            --zip-name "${{ matrix.driver.name }}" \
            --zip-url "${{ matrix.driver.url }}" \
            --output-dir dist

      - name: Upload ${{ matrix.driver.base }} APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.driver.base }}
          path: dist/${{ matrix.driver.base }}.apk
