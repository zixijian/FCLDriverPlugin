name: Manual Build Turnip Drivers

on:
  workflow_dispatch:

jobs:
  build-turnip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant execute permission for gradlew and scripts
        run: |
          chmod +x gradlew
          chmod +x scripts/package_turnip.py

      - name: Build Turnip Driver APKs
        id: build_drivers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/package_turnip.py --mode build --output-dir dist

      - name: Upload Packaged APKs
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Driver-APKs-${{ steps.build_drivers.outputs.tag_name }}
          path: dist/*.apk
