name: Monitor Upstream Turnip Drivers

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      has_update: ${{ steps.check_release.outputs.has_update }}
      tag_name: ${{ steps.check_release.outputs.tag_name }}
      matrix: ${{ steps.check_release.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Read last processed tag
        id: last_tag
        run: |
          if [ -f .last_tag ]; then
            TAG=$(cat .last_tag | tr -d '[:space:]')
          else
            TAG=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check for new Turnip release
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/package_turnip.py --mode check --last-tag "${{ steps.last_tag.outputs.tag }}"

      - name: Delete historical runs without artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          page=1

          while true; do
            response=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/actions/workflows/monitor_upstream.yml/runs?per_page=100&page=${page}")

            count=$(jq '.workflow_runs | length' <<< "$response")
            [ "$count" -gt 0 ] || break

            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue

              if [ "$run_id" = "$GITHUB_RUN_ID" ]; then
                echo "Keeping current run ${run_id}."
                continue
              fi

              run_status=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' <<< "$response")
              if [ "$run_status" != "completed" ]; then
                echo "Keeping active run ${run_id}: status=${run_status}."
                continue
              fi

              artifacts=$(curl --fail --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/actions/runs/${run_id}/artifacts")

              artifact_count=$(jq '.total_count // 0' <<< "$artifacts")
              if [ "$artifact_count" -eq 0 ]; then
                http_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                  -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${api}/actions/runs/${run_id}")

                if [ "$http_code" = "204" ]; then
                  echo "Deleted run ${run_id}: no artifacts."
                else
                  echo "Failed to delete run ${run_id}: HTTP ${http_code}."
                fi
              else
                echo "Keeping run ${run_id}: ${artifact_count} artifact(s)."
              fi
            done < <(jq -r '.workflow_runs[].id' <<< "$response")

            page=$((page + 1))
          done

  build-drivers:
    needs: check-upstream
    if: needs.check-upstream.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ fromJson(needs.check-upstream.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant execute permission for gradlew and scripts
        run: |
          chmod +x gradlew
          chmod +x scripts/package_turnip.py

      - name: Build Driver APK (${{ matrix.driver.name }})
        id: build_apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/package_turnip.py --mode build-single \
            --zip-name "${{ matrix.driver.name }}" \
            --zip-url "${{ matrix.driver.url }}" \
            --output-dir dist

      - name: Upload ${{ matrix.driver.base }} APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.driver.base }}
          path: dist/${{ matrix.driver.base }}.apk

  update-last-tag:
    needs: [check-upstream, build-drivers]
    if: needs.check-upstream.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update last processed tag
        run: |
          echo "${{ needs.check-upstream.outputs.tag_name }}" > .last_tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_tag
          git commit -m "chore: update last processed Turnip release to ${{ needs.check-upstream.outputs.tag_name }}" || exit 0
          git push origin "HEAD:${{ github.ref_name }}"
