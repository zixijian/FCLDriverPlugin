name: Monitor Upstream Turnip Drivers

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant execute permission for gradlew and scripts
        run: |
          chmod +x gradlew
          chmod +x scripts/package_turnip.py

      - name: Read last processed tag
        id: last_tag
        run: |
          if [ -f .last_tag ]; then
            TAG=$(cat .last_tag | tr -d '[:space:]')
          else
            TAG=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check for new Turnip release
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/package_turnip.py --mode check --last-tag "${{ steps.last_tag.outputs.tag }}"

      - name: Build Turnip Driver APKs
        if: steps.check_release.outputs.has_update == 'true'
        id: build_drivers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/package_turnip.py --mode build --output-dir dist

      - name: Upload Packaged APKs
        if: steps.check_release.outputs.has_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Driver-APKs-${{ steps.build_drivers.outputs.tag_name }}
          path: dist/*.apk

      - name: Update last processed tag
        if: steps.check_release.outputs.has_update == 'true'
        run: |
          echo "${{ steps.build_drivers.outputs.tag_name }}" > .last_tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_tag
          git commit -m "chore: update last processed Turnip release to ${{ steps.build_drivers.outputs.tag_name }}"
          git push origin dev
